<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Equipos de Medición - Ferramas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #f1f5f9;
        color: #0f172a;
      }

      header {
        background: #0f172a;
        color: white;

        padding: 20px 60px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      }

      .logo {
        font-size: 32px;
        font-weight: 700;

        color: #f59e0b;

        cursor: pointer;
      }

      nav {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      nav button {
        background: transparent;

        border: 2px solid #334155;

        color: white;

        padding: 10px 18px;

        border-radius: 12px;

        cursor: pointer;

        transition: 0.3s;

        font-weight: 500;
      }

      nav button:hover {
        background: #f59e0b;
        border-color: #f59e0b;
      }

      .usuario {
        position: relative;
      }

      .usuario-btn {
        background: #f59e0b !important;
        border: none !important;
      }

      .menu {
        display: none;

        position: absolute;

        right: 0;
        top: 55px;

        background: white;

        border-radius: 15px;

        overflow: hidden;

        min-width: 180px;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);

        z-index: 1000;
      }

      .menu button {
        width: 100%;

        border: none;

        background: white;

        color: #0f172a;

        padding: 14px;

        text-align: left;

        border-radius: 0;
      }

      .menu button:hover {
        background: #f8fafc;

        color: #f59e0b;
      }

      .banner {
        height: 320px;

        background:
          linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.82)),
          url("img/equipo1.jpg");

        background-size: cover;
        background-position: center;

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;

        padding: 20px;
      }

      .banner h1 {
        color: white;

        font-size: 55px;

        margin-bottom: 15px;
      }

      .banner p {
        color: #cbd5e1;

        font-size: 18px;

        max-width: 800px;

        line-height: 1.7;
      }

      .productos {
        padding: 70px 60px;
      }

      .productos h2 {
        text-align: center;

        font-size: 40px;

        margin-bottom: 50px;
      }

      .grid-productos {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

        gap: 30px;
      }

      .producto {
        background: white;

        border-radius: 22px;

        overflow: hidden;

        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

        transition: 0.3s;
      }

      .producto:hover {
        transform: translateY(-8px);
      }

      .producto img {
        width: 100%;
        height: 250px;

        object-fit: contain;

        background: white;

        padding: 12px;
      }

      .producto-contenido {
        padding: 25px;
      }

      .producto-contenido h3 {
        margin-bottom: 12px;

        font-size: 24px;
      }

      .producto-contenido p {
        color: #64748b;

        line-height: 1.6;

        margin-bottom: 20px;
      }

      .precio {
        font-size: 26px;

        font-weight: 700;

        color: #f59e0b;

        margin-bottom: 20px;
      }

      .producto-contenido button {
        width: 100%;

        border: none;

        background: #0f172a;

        color: white;

        padding: 14px;

        border-radius: 12px;

        cursor: pointer;

        font-size: 15px;

        font-weight: 600;

        transition: 0.3s;
      }

      .producto-contenido button:hover {
        background: #f59e0b;
      }

      footer {
        background: #020617;

        color: #94a3b8;

        text-align: center;

        padding: 25px;
      }

      @media (max-width: 768px) {
        header {
          flex-direction: column;

          gap: 20px;

          padding: 25px;
        }

        .banner h1 {
          font-size: 40px;
        }

        .productos {
          padding: 50px 20px;
        }
      }
      .notificacion {
        position: fixed;

        top: 25px;
        right: 25px;

        background: #0f172a;

        color: white;

        padding: 16px 22px;

        border-radius: 14px;

        font-weight: 600;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);

        opacity: 0;

        transform: translateY(-20px);

        transition: 0.4s;

        z-index: 9999;
      }

      .notificacion.mostrar {
        opacity: 1;

        transform: translateY(0);
      }
      .btn-moneda {
        background: #f59e0b;
        color: white;
        border: none;
        padding: 14px 22px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        margin-bottom: 30px;
        transition: 0.3s;
      }

      .btn-moneda:hover {
        background: #d97706;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo" onclick="window.location.href = 'index.html'">
        Ferramas
      </div>

      <nav>
        <button onclick="window.location.href = 'compra.html'">
          Mi Compra
        </button>

        <div class="usuario" id="usuarioContainer"></div>
      </nav>
    </header>

    <section class="banner">
      <div>
        <h1>Equipos de Medición</h1>

        <p>
          Instrumentos de precisión para construcción, trabajos técnicos y
          mediciones profesionales.
        </p>
      </div>
    </section>

    <section class="productos">
      <button class="btn-moneda" onclick="cambiarMoneda()">
        Ver precios en USD
      </button>
      <h2>Productos Disponibles</h2>

      <div class="grid-productos" id="grid-productos"></div>
    </section>

    <footer>© 2026 Ferramas - Equipos de Medición</footer>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));

      const usuarioContainer = document.getElementById("usuarioContainer");

      if (usuario) {
        usuarioContainer.innerHTML = `

          <button
            class="usuario-btn"
            onclick="toggleMenu()"
          >
            Hola ${usuario.nombre} ▼
          </button>

          <div
            class="menu"
            id="menuUsuario"
          >

            <button
              onclick="window.location.href='perfil.html'"
            >
              Mi Perfil
            </button>

            <button
              onclick="cerrarSesion()"
            >
              Cerrar Sesión
            </button>

          </div>

        `;
      } else {
        usuarioContainer.innerHTML = `

          <button
            onclick="window.location.href='login.html'"
          >
            Login
          </button>

        `;
      }

      function toggleMenu() {
        const menu = document.getElementById("menuUsuario");

        if (menu.style.display === "block") {
          menu.style.display = "none";
        } else {
          menu.style.display = "block";
        }
      }

      function cerrarSesion() {
        localStorage.removeItem("usuario");

        window.location.href = "index.html";
      }
      function mostrarNotificacion(texto) {
        const notificacion = document.getElementById("notificacion");

        notificacion.innerText = texto;

        notificacion.classList.add("mostrar");

        setTimeout(() => {
          notificacion.classList.remove("mostrar");
        }, 3000);
      }
      function agregarCarrito(nombre, precio) {
        let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

        carrito.push({
          nombre,
          precio,
        });

        localStorage.setItem("carrito", JSON.stringify(carrito));

        mostrarNotificacion("🛒 " + nombre + " agregado al carrito");
      }
      let enUSD = false;

      async function cambiarMoneda() {
        const precios = document.querySelectorAll(".precio");

        try {
          const response = await fetch("https://mindicador.cl/api");

          const data = await response.json();

          const dolar = data.dolar.valor;

          precios.forEach((precio) => {
            const valorCLP = precio.getAttribute("data-precio");

            if (!enUSD) {
              const usd = (valorCLP / dolar).toFixed(2);

              precio.innerHTML = `USD $${usd}`;
            } else {
              precio.innerHTML = `$${Number(valorCLP).toLocaleString("es-CL")} CLP`;
            }
          });

          enUSD = !enUSD;
        } catch (error) {
          alert("Error al obtener valor del dólar");
        }
      }
      async function cargarProductos() {
        try {
          const response = await fetch(
            "https://ferramas-yaig.onrender.com/productos",
          );
          const productos = await response.json();
          const filtrados = productos.filter((p) => p.categoria === "medicion");
          const grid = document.getElementById("grid-productos");
          grid.innerHTML = "";
          const imagenes = {
            "Huincha de Medir 5m": "img/Huincha.png",
            "Nivel Láser Profesional": "img/Nivel.png",
            "Calibrador Digital": "img/Calibrador.png",
          };
          filtrados.forEach((producto) => {
            const img = imagenes[producto.nombre] || "img/default.png";
            grid.innerHTML += `
        <div class="producto">
          <div class="contenido">
            <img src="${img}" alt="${producto.nombre}" />
            <div class="producto-contenido"></div>
            <h3>${producto.nombre}</h3>
            <div class="precio" data-precio="${producto.precio}">$${producto.precio.toLocaleString("es-CL")} CLP</div>
            <button onclick="agregarCarrito('${producto.nombre}', ${producto.precio})">Agregar al Carrito</button>
          </div>
        </div>`;
          });
        } catch (error) {
          console.error("Error cargando productos:", error);
        }
      }
      cargarProductos();
    </script>
    <div id="notificacion" class="notificacion"></div>
  </body>
</html>
