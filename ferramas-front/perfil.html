<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Perfil - Ferramas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;

        background:
          linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)),
          url("https://images.unsplash.com/photo-1504307651254-35680f356dfd?q=80&w=1600&auto=format&fit=crop");

        background-size: cover;
        background-position: center;

        padding: 40px;

        color: white;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 40px;
      }

      .logo {
        font-size: 35px;
        font-weight: 700;
        color: #f59e0b;

        cursor: pointer;
      }

      .volver {
        background: white;
        border: none;

        padding: 12px 20px;

        border-radius: 12px;

        cursor: pointer;

        font-weight: 600;

        transition: 0.3s;
      }

      .volver:hover {
        background: #f59e0b;
        color: white;
      }

      .perfil-container {
        max-width: 850px;
        margin: auto;

        background: white;

        color: #0f172a;

        padding: 45px;

        border-radius: 25px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .perfil-header {
        display: flex;
        align-items: center;
        gap: 25px;

        margin-bottom: 40px;
      }

      .avatar {
        width: 100px;
        height: 100px;

        border-radius: 50%;

        background: #f59e0b;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 40px;
        font-weight: 700;
        color: white;
      }

      .perfil-header h1 {
        font-size: 35px;
        margin-bottom: 5px;
      }

      .perfil-header p {
        color: #64748b;
      }

      .info-grid {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

        gap: 20px;

        margin-bottom: 40px;
      }

      .card {
        background: #f8fafc;

        padding: 25px;

        border-radius: 18px;
      }

      .card h3 {
        margin-bottom: 10px;
        color: #0f172a;
      }

      .card p {
        color: #475569;
      }

      .historial {
        margin-top: 20px;
      }

      .historial h2 {
        margin-bottom: 20px;
      }

      .compra {
        background: #f8fafc;

        padding: 20px;

        border-radius: 15px;

        margin-bottom: 15px;
      }

      .compra strong {
        color: #0f172a;
      }

      .cerrar {
        margin-top: 40px;

        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 14px;

        background: #dc2626;

        color: white;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.3s;
      }

      .cerrar:hover {
        background: #b91c1c;
      }
    </style>
  </head>

  <body>
    <div class="topbar">
      <div class="logo" onclick="window.location.href = 'index.html'">
        Ferramas
      </div>

      <button class="volver" onclick="window.location.href = 'index.html'">
        ← Inicio
      </button>
    </div>

    <div class="perfil-container">
      <div class="perfil-header">
        <div class="avatar" id="avatar">A</div>

        <div>
          <h1 id="nombreUsuario">Usuario</h1>

          <p id="correoUsuario">correo@gmail.com</p>
        </div>
      </div>

      <div class="info-grid">
        <div class="card">
          <h3>Descuento Disponible</h3>

          <p id="descuentoUsuario">10%</p>
        </div>

        <div class="card">
          <h3>Estado de Cuenta</h3>

          <p>Cliente Activo</p>
        </div>

        <div class="card">
          <h3>Tipo de Cliente</h3>

          <p>Cliente Frecuente</p>
        </div>
      </div>

      <div class="historial">
        <h2>Historial de Compras</h2>

        <div class="compra">
          <strong> Taladro Bosch </strong>

          <p>Compra realizada correctamente</p>
        </div>

        <div class="compra">
          <strong> Kit de Herramientas </strong>

          <p>Compra realizada correctamente</p>
        </div>
      </div>

      <button class="cerrar" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));

      if (!usuario) {
        window.location.href = "login.html";
      }

      document.getElementById("nombreUsuario").innerText = usuario.nombre;

      document.getElementById("correoUsuario").innerText = usuario.correo;

      document.getElementById("descuentoUsuario").innerText =
        usuario.descuento + "%";

      document.getElementById("avatar").innerText = usuario.nombre
        .charAt(0)
        .toUpperCase();

      function cerrarSesion() {
        localStorage.removeItem("usuario");

        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
